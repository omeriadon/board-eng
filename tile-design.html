<!doctype html><html><head><meta charset="utf-8"><style>
:root{color-scheme:dark light}
body{margin:0;font-family:var(--font-sans)}
h3{font-size:14px;margin:18px 0 6px;color:var(--foreground)}
p.note{font-size:12px;color:var(--muted-foreground);margin:0 0 6px}
svg{display:block}
.lbl{fill:var(--foreground);font-size:12px}
.sub{fill:var(--muted-foreground);font-size:11px}
.tiny{fill:var(--foreground);font-size:9px}
.lead{stroke:var(--muted-foreground);stroke-width:0.8;stroke-dasharray:2 2}
.dim{stroke:var(--muted-foreground);stroke-width:1}
.pla{fill:#2a2a2e;stroke:#6b6b75;stroke-width:0.8}
.mdf{fill:#1c1c1f;stroke:#55555c;stroke-width:0.8}
.acrylic{fill:#3a3340;stroke:#a58fbf;stroke-width:0.8;opacity:.95}
.pcb{fill:#111;stroke:#7a7a85;stroke-width:0.8}
.led{fill:#f2f2f2;stroke:#999;stroke-width:0.5}
.metal{fill:#8d939c;stroke:#c4c9d0;stroke-width:0.6}
.hole{fill:var(--background);stroke:#6b6b75;stroke-width:0.6}
.felt{fill:#7a5a3a}
.cut{fill:none;stroke:#9a9aa5;stroke-width:0.8}
.wire{fill:none;stroke:#d9534f;stroke-width:1.2}
.elec{fill:#5a1f1f;stroke:#c25a5a;stroke-width:0.8}
.frontbg{fill:#0d0d0f;stroke:#333;stroke-width:1}
</style></head><body>
<h3>1 · One tile, exploded (side view, front at top)</h3>
<p class="note">Rough concept · example numbers for 5×5 tiles × 4×4 LEDs (40 mm pitch). Everything scales with N and k.</p>

,190.0 l2.4,2.2 l-2.4,2.2" class="cut"/><path d="M58.5,199.0 l2.4,2.2 l-2.4,2.2" class="cut"/><path d="M58.5,208.0 l2.4,2.2 l-2.4,2.2" class="cut"/><path d="M58.5,217.0 l2.4,2.2 l-2.4,2.2" class="cut"/><path d="M58.5,226.0 l2.4,2.2 l-2.4,2.2" class="cut"/><path d="M58.5,235.0 l2.4,2.2 l-2.4,2.2" class="cut"/><rect x="113.7" y="250.0" width="4.8" height="24.0" class="hole" /><rect x="79.5" y="292.0" width="18.0" height="15.0" class="pla" /><circle cx="88.5" cy="299.5" r="3.0" class="hole"/><rect x="39.0" y="159.0" width="0.0" height="0.0" class="pla" /><line x1="151.0" y1="163.0" x2="300.0" y2="163.0" class="lead"/><text x="305.0" y="167.0" class="lbl" text-anchor="start">④ Stem · black PLA · floor plate screws into head, sandwiching the PCB</text><text x="305.0" y="183.0" class="sub" text-anchor="start">   20×20 mm square tube (can’t rotate) · hollow for wires · 40 mm long</text><line x1="54.5" y1="211.0" x2="44.5" y2="211.0" class="lead"/><text x="42.5" y="215.0" class="sub" text-anchor="end">detent</text><text x="42.5" y="228.0" class="sub" text-anchor="end">notches</text><line x1="122.5" y1="262.0" x2="300.0" y2="262.0" class="lead"/><text x="305.0" y="266.0" class="sub" text-anchor="start">   wire exit slot</text><rect x="73.5" y="310.0" width="30.0" height="18.0" class="metal" /><rect x="86.1" y="328.0" width="4.8" height="66.0" class="metal" /><rect x="70.5" y="394.0" width="36.0" height="30.0" class="metal" /><line x1="110.5" y1="319.0" x2="300.0" y2="319.0" class="lead"/><text x="305.0" y="323.0" class="lbl" text-anchor="start">⑤ Slider nut of the 8 mm micro stepper · M2 screw through the stem tab</text><line x1="110.5" y1="406.0" x2="300.0" y2="406.0" class="lead"/><text x="305.0" y="410.0" class="lbl" text-anchor="start">⑥ Micro slider stepper (lead-screw = the “screw drive” mechanism)</text><text x="305.0" y="426.0" class="sub" text-anchor="start">   mounted on the motor plate; 10–20 mm stroke</text></svg>
